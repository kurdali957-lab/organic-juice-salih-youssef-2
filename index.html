<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Juices - Order Form</title>
        <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
   
</head>
<body>

    <div id="invoice-container">
        <div class="header-section">
            <div class="header-title">
                <img src="icon.png.jpg" alt="Logo" class="header-logo">
                <span>Organic Juices</span>
            </div>
        </div>

        <div class="info-section">
            <div class="info-item">
                <label>به ريز:</label>
                <input type="text" id="cust-name">
            </div>
            <div class="info-item">
                <label>ناڤ ونيشان:</label>
                <input type="text" id="cust-address">
            </div>
            <div class="info-item">
                <label>ميژوو:</label>
                <input type="text" id="cust-date">
            </div>
        </div>
        <div class="tables-container">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 30%;">فيقی</th>
                            <th style="width: 35%;">هژمار</th>
                            <th style="width: 35%;">تيبینی</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="actions-row">
        <button class="export-btn" onclick="generatePDF()">تصدير الفاتورة (PDF)</button>
    </div>

   <script src="script.js"></script>
</body>
</html>
